[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "boxtrot"
dynamic = ["version"]
description = "Review detector output on georeferenced imagery and build labelled datasets, with optional model-assisted labelling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "boxtrot contributors" }]
keywords = ["remote sensing", "labelling", "annotation", "object detection", "satellite imagery", "GIS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.23",
    "rasterio>=1.3",
    "pyproj>=3.4",
    "pillow>=9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.gui-scripts]
boxtrot = "boxtrot.ui.app:main"

[project.urls]
Homepage = "https://github.com/mikechirico/boxtrot"
Issues = "https://github.com/mikechirico/boxtrot/issues"

[tool.setuptools.dynamic]
version = { attr = "boxtrot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: drives the real Tk app (needs a display; windows appear briefly)"]

[tool.ruff]
line-length = 130
src = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE", "I"]
ignore = ["B008", "B905"]
