[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "boxtrot-ultralytics"
version = "0.1.0"
description = "Ultralytics YOLO training backend for boxtrot's model-assisted labelling (AGPL-3.0 add-on)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["boxtrot>=0.1", "ultralytics>=8.1"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.entry-points."boxtrot.trainers"]
ultralytics = "boxtrot_ultralytics:UltralyticsBackend"

[tool.setuptools.packages.find]
where = ["src"]
